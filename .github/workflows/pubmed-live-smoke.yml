name: PubMed live ESearch / EFetch smoke (manual)

# Manual only. Never run live provider calls on PRs, pushes, or schedules.
# This workflow can be dispatched only once merged into the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-y-pubmed-source-smoke
  cancel-in-progress: false

jobs:
  source-smoke:
    name: Opt-in live PubMed query and one PMID
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEARCHY_NCBI_CONTACT_EMAIL: ${{ secrets.RESEARCHY_NCBI_CONTACT_EMAIL }}
      RESEARCHY_NCBI_API_KEY: ${{ secrets.RESEARCHY_NCBI_API_KEY }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - name: Require private NCBI contact setting
        shell: bash
        run: |
          if [ -z "$RESEARCHY_NCBI_CONTACT_EMAIL" ]; then
            echo "::error::Configure the RESEARCHY_NCBI_CONTACT_EMAIL Actions secret before running this workflow."
            exit 2
          fi
      - name: Install application code
        run: python -m pip install -e .
      - name: Run read-only ESearch and one-record EFetch
        # Fixed generic public test query. Do not put proprietary study queries
        # or credentials in public workflow inputs or logs.
        run: python scripts/pubmed_source_smoke.py --query '("ECMO"[All Fields])'
