name: Web of Science Starter durable retrieval and recovery (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_local_retention:
        description: 'I confirm my source terms permit temporary local retention of up to 30,000 Starter records for this test.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: research-y-wos-starter-live
  cancel-in-progress: false

jobs:
  durable-recovery:
    if: ${{ inputs.confirm_local_retention }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
      - name: Install application
        run: python -m pip install -e .
      - name: Commit one real source page then pause
        shell: bash
        env:
          RESEARCHY_WOS_STARTER_API_KEY: ${{ secrets.RESEARCHY_WOS_STARTER_API_KEY }}
          RESEARCHY_WOS_RETENTION_AUTHORIZED: 'true'
        run: python scripts/wos_checkpoint_validation.py start --workspace "$RUNNER_TEMP/researchy-wos-checkpoint"
      - name: Reopen in a new process and reconcile acquisition and identity verification
        shell: bash
        env:
          RESEARCHY_WOS_STARTER_API_KEY: ${{ secrets.RESEARCHY_WOS_STARTER_API_KEY }}
          RESEARCHY_WOS_RETENTION_AUTHORIZED: 'true'
        run: python scripts/wos_checkpoint_validation.py resume --workspace "$RUNNER_TEMP/researchy-wos-checkpoint"
      - name: Retain only aggregate counts and hashes, never licensed records
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wos-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/researchy-wos-checkpoint/wos-checkpoint-evidence.json
          if-no-files-found: ignore
          retention-days: 14
