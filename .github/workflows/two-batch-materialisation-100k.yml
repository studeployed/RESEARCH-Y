name: Explicit two-batch 100k original publication window

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/two-batch-materialisation-100k.yml'
      - 'scripts/benchmark_materialisation_window.py'
      - 'scripts/benchmark_production_materialisation.py'
      - 'tests/test_publication_materialisation_window.py'
      - 'src/research_y/publication_materialisation_window.py'
      - 'src/research_y/original_source_scope.py'
      - 'src/research_y/publication_run_materialisation.py'
      - 'src/research_y/application_commands.py'
      - 'src/research_y/application_worker.py'
      - 'src/research_y/publication_identity.py'
      - 'src/research_y/result_counts.py'
      - 'docs/TWO_BATCH_MATERIALISATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: two-batch-original-100k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-window:
    name: 100k original two-batch window ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install source-only processing services
        run: python -m pip install -e .
      - name: Exercise one approved two-batch window in genuine spawned worker
        run: python -m scripts.benchmark_materialisation_window --records 100000 --matched 64 --worker-timeout-seconds 35 --json-output .performance-evidence/two-batch-original-100k.json
      - name: Require original source preservation, audited commits and finite host budget
        shell: python
        run: |
          import json
          from pathlib import Path
          report=json.loads(Path('.performance-evidence/two-batch-original-100k.json').read_text(encoding='utf-8'))
          assert report['synthetic_original_source_records']==100000
          assert report['initial_provisional_identities']==128
          assert report['initial_pending']==99872
          assert report['batch_sizes']==[64,64]
          assert report['confirmed_window_commits']==2
          assert report['committed_source_records']==128
          assert report['final_provisional_identities']==256
          assert report['identity_audit_events']==256
          assert report['final_pending']==99744
          assert report['complete_two_batch_probe'] is True
          assert report['preview_worker']['returned'] is True
          assert report['confirm_worker']['returned'] is True
          assert report['preview_worker']['elapsed_ms']<35000
          assert report['confirm_worker']['elapsed_ms']<35000
          assert report['original_source_and_membership_hashes_unchanged'] is True
          assert report['sqlite_integrity_check']=='ok'
          assert report['foreign_key_check']=='ok'
          assert report['replay_error']=='publication_materialisation_stale'
          assert report['replay_no_mutation'] is True
          assert report['native_browser_rendering_measured'] is False
          assert report['full_100k_production_materialisation_exercised'] is False
          assert report['real_researcher_consent_exercised'] is False
          assert report['unattended_processing'] is False
          assert report['source_retrieval_verified'] is False
          assert report['deduplication_complete'] is False
          assert report['verified_complete'] is False
          assert report['global_unique_publications'] is None
          assert report['full_AT_22_acceptance'] is False
          assert report['no_network_requests'] is True
          print('Original two-batch worker elapsed ms:',report['confirm_worker']['elapsed_ms'])
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: original-two-batch-100k-${{ matrix.os }}-py312
          path: .performance-evidence/two-batch-original-100k.json
          if-no-files-found: error
          retention-days: 21
