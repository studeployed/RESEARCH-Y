name: PubMed Create Date count diagnostic (manual)

# P1-04h: two ESearch count-only probes, no PMID/EFetch requests.
# Never run on PR, push, schedule or repository_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-y-pubmed-source-smoke
  cancel-in-progress: false

jobs:
  first-partition-count:
    name: Record accepted root and first Create Date partition translations
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RESEARCHY_NCBI_CONTACT_EMAIL: ${{ secrets.RESEARCHY_NCBI_CONTACT_EMAIL }}
      RESEARCHY_NCBI_API_KEY: ${{ secrets.RESEARCHY_NCBI_API_KEY }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - name: Require private authorised NCBI contact
        shell: bash
        run: |
          if [ -z "$RESEARCHY_NCBI_CONTACT_EMAIL" ]; then
            echo "::error::Configure the RESEARCHY_NCBI_CONTACT_EMAIL Actions secret."
            exit 2
          fi
      - name: Install application code
        run: python -m pip install -e .
      - name: Diagnose count-only first Create Date partition
        # Fixed generic query; source request count capped at two.
        shell: bash
        run: python scripts/pubmed_partition_count_diagnostic.py --output "$RUNNER_TEMP/pubmed-partition-count/pubmed-partition-count-diagnostic.json"
      - name: Retain safe count-only evidence even when review is required
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pubmed-partition-count-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/pubmed-partition-count/pubmed-partition-count-diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
