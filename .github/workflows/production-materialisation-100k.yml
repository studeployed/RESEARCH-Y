name: Production-consented 100k source materialisation probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-materialisation-100k.yml'
      - 'scripts/benchmark_production_materialisation.py'
      - 'scripts/benchmark_original_project.py'
      - 'tests/test_production_materialisation_performance.py'
      - 'src/research_y/publication_run_materialisation.py'
      - 'src/research_y/application_commands.py'
      - 'src/research_y/application_worker.py'
      - 'src/research_y/publication_identity.py'
      - 'src/research_y/result_counts.py'
      - 'docs/PRODUCTION_MATERIALISATION_100K.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-materialisation-100k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audited-consent:
    name: Confirmed 64-record production batches ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install RESEARCH-Y internal processing services
        run: python -m pip install -e .
      - name: Exercise existing trusted preview/confirm operations twice on 100k originals
        run: python scripts/benchmark_production_materialisation.py --records 100000 --matched 64 --worker-timeout-seconds 35 --json-output .performance-evidence/production-materialisation-100k.json
      - name: Verify 100k original evidence and two committed 64-row steps
        shell: python
        run: |
          import json
          from pathlib import Path
          data=json.loads(Path('.performance-evidence/production-materialisation-100k.json').read_text(encoding='utf-8'))
          assert data['synthetic_original_source_records']==100000
          assert data['initial_original_provisional_identities']==128
          assert data['batch_size']==64
          assert data['planned_confirmations']==2
          assert data['actual_production_confirmations']==2
          assert data['completed_two_batches'] is True
          assert data['fixture_only_bulk_materialiser_used'] is False
          assert data['no_real_researcher_consent_claimed'] is True
          original=data['initial_evidence']
          final=data['final_evidence']
          assert original['source_records']==100000
          assert original['membership_rows']==100000
          assert original['source_identity_links']==128
          assert original['identity_audit_events']==128
          assert original['selected_run_pending']==99872
          assert final['source_records']==100000
          assert final['selected_run_records']==100000
          assert final['membership_rows']==100000
          assert final['source_identity_links']==256
          assert final['selected_run_identity_links']==256
          assert final['provisional_publications']==256
          assert final['identity_audit_events']==256
          assert final['selected_run_pending']==99744
          assert final['source_rows_sha256']==original['source_rows_sha256']
          assert final['membership_rows_sha256']==original['membership_rows_sha256']
          assert final['sqlite_integrity_check']=='ok'
          assert final['foreign_key_check']=='ok'
          assert [s['preview_pending'] for s in data['stages']]==[99872,99808]
          for step in data['stages']:
              assert step['preview_worker']['returned'] is True
              assert step['confirm_worker']['returned'] is True
              assert step['preview_worker']['elapsed_ms'] < 35000
              assert step['confirm_worker']['elapsed_ms'] < 35000
              assert step['reopened_after_commit'] is True
              assert step['replay_error']=='publication_materialisation_stale'
              assert step['stale_replay_no_mutation'] is True
          assert data['global_unique_publications'] is None
          assert data['deduplication_complete'] is False
          assert data['verified_complete'] is False
          assert data['source_retrieval_verified'] is False
          assert data['full_AT_22_acceptance'] is False
          assert data['no_network_requests'] is True
          print('Production preview/confirm worker intervals (ms):', [(s['preview_worker']['elapsed_ms'],s['confirm_worker']['elapsed_ms']) for s in data['stages']])
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: production-confirmed-100k-${{ matrix.os }}-py312
          path: .performance-evidence/production-materialisation-100k.json
          if-no-files-found: error
          retention-days: 21
