name: Web of Science Starter entitlement and paging smoke (manual)

# Never contact the licensed provider from automatic PR/push/scheduled checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-y-wos-starter-live
  cancel-in-progress: false

jobs:
  starter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - name: Install application
        run: python -m pip install -e .
      - name: Validate institutional allowance and two adjacent pages
        # Only this step gets the key. No arbitrary query inputs or raw uploads.
        env:
          RESEARCHY_WOS_STARTER_API_KEY: ${{ secrets.RESEARCHY_WOS_STARTER_API_KEY }}
        shell: bash
        run: python scripts/wos_source_smoke.py --output "$RUNNER_TEMP/wos-starter-evidence.json"
      - name: Retain aggregate evidence without licensed records or credentials
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wos-starter-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/wos-starter-evidence.json
          if-no-files-found: ignore
          retention-days: 14
