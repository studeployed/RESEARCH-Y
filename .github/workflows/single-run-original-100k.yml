name: Single selected-run 100k original publication evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/single-run-original-100k.yml'
      - 'scripts/benchmark_original_project.py'
      - 'tests/test_original_project_performance.py'
      - 'docs/SINGLE_RUN_ORIGINAL_100K.md'
      - 'src/research_y/publication_identity.py'
      - 'src/research_y/publication_candidate_queue.py'
      - 'src/research_y/publication_results.py'
      - 'src/research_y/result_counts.py'
      - 'src/research_y/application_worker.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-run-original-100k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-run-originals:
    name: 100k selected-run originals ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install original source services
        run: python -m pip install -e .
      - name: Benchmark one 100k-source selected run with audited provisional identities
        run: python scripts/benchmark_original_project.py --records 100000 --selected 100000 --matched 64 --materialise-all --worker-timeout-seconds 35 --json-output .performance-evidence/single-run-original-100k.json
      - name: Assert single-run source, candidate, audit and host-bound evidence
        shell: python
        run: |
          import json
          from pathlib import Path
          data=json.loads(Path('.performance-evidence/single-run-original-100k.json').read_text(encoding='utf-8'))
          assert data['synthetic_original_source_records']==100000
          assert data['selected_run_source_records']==100000
          assert data['historical_run_source_records']==0
          assert data['selected_run_provisional_identities']==100000
          assert data['original_provisional_identities']==100000
          assert data['all_100k_sources_in_selected_run'] is True
          assert data['all_100k_source_records_materialised'] is True
          assert data['unmaterialised_source_records']==0
          assert data['matched_source_pairs']==64
          assert data['audited_identity_link_events']==100000
          assert data['all_original_query_memberships_preserved'] is True
          assert data['fixture_materialisation_resume']['independently_reopened_before_resume'] is True
          assert data['restored_row_counts_match'] is True
          assert data['original_sqlite_integrity_check']=='ok'
          assert data['original_foreign_key_check']=='ok'
          assert data['worker']['status']=='returned'
          assert data['worker']['completed'] is True
          assert data['worker']['candidate_count']==64
          assert data['worker']['response_rows']==20
          assert data['worker']['wall_ms']<35000
          assert data['native_browser_rendering_measured'] is False
          assert data['researcher_confirmed_materialisation_workflow_tested'] is False
          assert data['source_retrieval_verified'] is False
          assert data['deduplication_complete'] is False
          assert data['verified_complete'] is False
          assert data['global_unique_publications'] is None
          assert data['full_AT_22_acceptance'] is False
          assert data['no_network_requests'] is True
          print('Single-run candidate page and worker:',data['timings_ms']['first_source_backed_candidate_page_ms'],data['worker']['wall_ms'])
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: single-run-original-100k-${{ matrix.os }}-py312
          path: .performance-evidence/single-run-original-100k.json
          if-no-files-found: error
          retention-days: 21
