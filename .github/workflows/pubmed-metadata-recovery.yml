name: Bounded PubMed OR and metadata recovery sample (manual)
on:
  workflow_dispatch:
    inputs:
      confirm_sample:
        description: 'I authorize up to ten NCBI requests and temporary retention of up to 20 PubMed records on this runner.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  recovery:
    if: ${{ inputs.confirm_sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Check OR translations, reconcile the small identifier set and commit one metadata record
        env:
          RESEARCHY_NCBI_CONTACT_EMAIL: ${{ secrets.RESEARCHY_NCBI_CONTACT_EMAIL }}
          RESEARCHY_NCBI_API_KEY: ${{ secrets.RESEARCHY_NCBI_API_KEY }}
          RESEARCHY_PUBMED_SAMPLE_AUTHORIZED: 'true'
        run: python -m scripts.pubmed_metadata_recovery_validation start --workspace "$RUNNER_TEMP/ry-pubmed-metadata"
      - name: Reopen, reconfirm count and fetch only missing metadata
        env:
          RESEARCHY_NCBI_CONTACT_EMAIL: ${{ secrets.RESEARCHY_NCBI_CONTACT_EMAIL }}
          RESEARCHY_NCBI_API_KEY: ${{ secrets.RESEARCHY_NCBI_API_KEY }}
          RESEARCHY_PUBMED_SAMPLE_AUTHORIZED: 'true'
        run: python -m scripts.pubmed_metadata_recovery_validation resume --workspace "$RUNNER_TEMP/ry-pubmed-metadata"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: pubmed-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/ry-pubmed-metadata/metadata-evidence.json
          retention-days: 14
          if-no-files-found: error
