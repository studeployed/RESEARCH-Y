name: Windows standalone installer
on:
  push:
    branches: [main]
    paths:
      - 'src/research_y/__init__.py'
  pull_request:
    branches: [main]
    paths:
      - 'tools/windows_distribution/**'
      - '.github/workflows/windows-installer.yml'
      - 'pyproject.toml'
      - 'src/research_y/desktop/**'
      - 'src/research_y/install_local_assistant.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
      - name: Check out the integrated Phase 3 installer baseline
        uses: actions/checkout@v4.2.2
        with:
          ref: 030a2f8c385d2fcfe466f391f4dc0eb60507f6d5
          path: _installer_baseline
          persist-credentials: false
      - name: Build baseline installer for the upgrade check
        run: python _installer_baseline/tools/windows_distribution/build.py build/Baseline-Setup.exe
      - name: Build bundled per-user installer
        run: python tools/windows_distribution/build.py build/RESEARCH-Y-Setup.exe
      - name: Verify clean install, reinstallation, real upgrade and project preservation
        run: python tools/windows_distribution/verify_install.py build/RESEARCH-Y-Setup.exe build/Baseline-Setup.exe build/verification.json
      - name: Verify the final installer digest and record the release evidence
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $evidence = Get-Content -Raw build/verification.json | ConvertFrom-Json
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath build/RESEARCH-Y-Setup.exe).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath build/RESEARCH-Y-Setup.exe).Length
          if ($evidence.commit -cne $env:GITHUB_SHA -or $evidence.installer_sha256 -cne $digest -or $evidence.bytes -ne $size) {
            throw "Installer file and verification record disagree"
          }
          "RESEARCH-Y $($evidence.version) on Windows x64" >> $env:GITHUB_STEP_SUMMARY
          "Commit $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Installer SHA-256 $digest ($size bytes)" >> $env:GITHUB_STEP_SUMMARY
          Get-Content -Raw build/verification.json
      - name: Retain the tested installer and its checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: RESEARCH-Y-Windows-${{ github.sha }}
          path: |
            build/RESEARCH-Y-Setup.exe
            build/verification.json
          if-no-files-found: error
      - name: Retain pull request verification evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: installer-verification-${{ github.sha }}
          path: build/verification.json
          if-no-files-found: error
